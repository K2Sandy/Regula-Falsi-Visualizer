# Tema "buku tulis matematika": kertas grid, tinta navy, pulpen biru,
# stabilo kuning, dan merah koreksi. Warna yang sama dipakai di grafik.py.

[theme]
base = "light"
primaryColor = "#2750e6"            # pulpen biru: tombol, slider, tab aktif
backgroundColor = "#f1f6f4"         # kertas
secondaryBackgroundColor = "#ffffff"
textColor = "#14213d"               # tinta navy
linkColor = "#2750e6"
borderColor = "#14213d"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "12px"
redColor = "#d7263d"                # merah koreksi
yellowColor = "#ffd23f"             # stabilo
blueColor = "#2750e6"
greenColor = "#1f8a5b"
font = "Figtree:https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
headingFont = "Bricolage Grotesque:https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap"
headingFontWeights = [800, 800, 700, 700, 700, 700]
dataframeHeaderBackgroundColor = "#fff6cf"
dataframeBorderColor = "#c9d1dd"

[client]
toolbarMode = "minimal"             # sembunyikan tombol Deploy dan menu pengembang
